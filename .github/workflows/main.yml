name: R Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # FIX: Installs the missing OpenMP library required by CVXR
      - name: Install OpenMP on macOS
        run: |
          brew install libomp
          mkdir -p ~/.R
          echo "SHLIB_OPENMP_CFLAGS=-Xpreprocessor -fopenmp" >> ~/.R/Makevars
          echo "SHLIB_OPENMP_CXXFLAGS=-Xpreprocessor -fopenmp" >> ~/.R/Makevars
          echo "LDFLAGS+=-L$(brew --prefix libomp)/lib -lomp" >> ~/.R/Makevars
          echo "CPPFLAGS+=-I$(brew --prefix libomp)/include" >> ~/.R/Makevars

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::CVXR
            any::lglasso

